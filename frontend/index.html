<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arusuvai</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main class="container stack-lg" style="padding-block: var(--space-12);">
      <header class="stack">
        <h1 class="gradient-text">Arusuvai</h1>
        <p class="text-muted">Design-token sandbox - edit <code>css/theme.css</code> to retheme.</p>
      </header>

      <section class="cluster">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-accent">Accent</button>
        <button class="btn btn-outline">Outline</button>
        <button class="btn btn-ghost">Ghost</button>
      </section>

      <section class="cluster">
        <span class="badge">In stock</span>
        <span class="badge badge-accent">New</span>
        <span class="badge badge-success">Verified</span>
        <span class="badge badge-danger">Sold out</span>
      </section>

      <section class="card card-hover" style="max-width: 360px;">
        <h3>Card</h3>
        <p class="text-muted">Cards inherit radius, border and shadow from tokens.</p>
        <div style="margin-top: var(--space-4);">
          <input class="input" placeholder="Email" />
        </div>
      </section>

      <section class="stack">
        <h4 class="tamil-text">அருசுவை</h4>
        <p class="tamil-text text-muted">Tamil text uses Noto Sans Tamil via the .tamil-text utility.</p>
      </section>
    </main>
  </body>
</html>
