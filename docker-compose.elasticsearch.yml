# Local Elasticsearch for /api/product/search.
#
# Start:  docker compose -f docker-compose.elasticsearch.yml up -d
# Stop:   docker compose -f docker-compose.elasticsearch.yml down
# Logs:   docker compose -f docker-compose.elasticsearch.yml logs -f
#
# Single-node, dev-only. Security disabled so the app can talk over HTTP
# with no auth. Do NOT use this config in production.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: arusuvai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  es_data:
